name: Live Scores — WorldSquad

on:
  schedule:
    # Every 10 minutes during World Cup match hours (UTC)
    - cron: '*/10 14-23 * * *'
    - cron: '*/10 0-5 * * *'
  workflow_dispatch:

# Prevent multiple concurrent runs (if previous run is still going, skip)
concurrency:
  group: live-scores
  cancel-in-progress: false

jobs:
  auto-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Auto-launch matches when match_date is reached
        run: |
          echo "Auto-launch check at $(date -u)"
          result=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/auto-launch-matches")
          echo "$result"
          launched=$(echo "$result" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('launched',0))" 2>/dev/null || echo "0")
          echo "Matches launched: $launched"

  poll-live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Poll live scores and log result
        run: |
          echo "Polling live scores at $(date -u)"
          result=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/live-scores")
          echo "$result"
          status=$(echo "$result" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('matchesChecked','?'))" 2>/dev/null || echo "?")
          echo "Matches checked: $status"
