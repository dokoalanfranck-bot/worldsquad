name: Live Scores — WorldSquad

on:
  schedule:
    # Every 5 minutes from 14:00 to 05:00 UTC (covers all World Cup match hours)
    - cron: '*/5 14-23 * * *'
    - cron: '*/5 0-5 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  poll-live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Poll live scores
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/live-scores")
          echo "Response status: $response"
          if [ "$response" != "200" ]; then
            echo "Warning: unexpected status $response"
          fi

      - name: Log result
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/live-scores" | head -500
